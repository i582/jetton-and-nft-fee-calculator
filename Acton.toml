[package]
name = "jetton-transfer-fees"
description = "Reproducible GRAM budgets for ordinary jetton and NFT transfers"
version = "0.1.0"

[toolchain]
acton = "1.2.0"

[contracts.Relay]
src = "contracts/Relay.tolk"

[contracts.m101]
src = "contracts/jetton/m101.boc"

[contracts.m102]
src = "contracts/jetton/m102.boc"

[contracts.m103]
src = "contracts/jetton/m103.boc"

[contracts.m105]
src = "contracts/jetton/m105.boc"

[fmt]
width = 100

[scripts]
measure = "bun start"

[import-mappings]
acton = ".acton"

[contracts.Jetton2Wallet]
src = "contracts/jetton/Jetton2Wallet.boc"
types = "contracts/jetton/Jetton2Wallet.types.tolk"

[contracts.JettonNotcoinWallet]
src = "contracts/jetton/JettonNotcoinWallet.boc"
types = "contracts/jetton/JettonNotcoinWallet.types.tolk"

[contracts.JettonWallet]
src = "contracts/jetton/JettonWallet.boc"
types = "contracts/jetton/JettonWallet.types.tolk"

[contracts.StablecoinWallet]
src = "contracts/jetton/StablecoinWallet.boc"
types = "contracts/jetton/StablecoinWallet.types.tolk"

[contracts.minter]
src = "contracts/jetton/minter.boc"

[contracts.v100]
src = "contracts/jetton/v100.boc"

[contracts.v101]
src = "contracts/jetton/v101.boc"

[contracts.v102]
src = "contracts/jetton/v102.boc"

[contracts.v103]
src = "contracts/jetton/v103.boc"

[contracts.v105]
src = "contracts/jetton/v105.boc"

[contracts.v107]
src = "contracts/jetton/v107.boc"

[contracts.NftV1Item]
src = "contracts/nft/NftV1Item.boc"
types = "contracts/nft/NftV1Item.types.tolk"

[contracts.NftV1EditableItem]
src = "contracts/nft/NftV1EditableItem.boc"
types = "contracts/nft/NftV1EditableItem.types.tolk"

[contracts.GetgemsNftItemV2]
